<!DOCTYPE html>
<html lang="mn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Төслийн дэлгэрэнгүй | UVS 2 ECO CLUB</title>

  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/header.css">
  <link rel="stylesheet" href="../css/footer.css">
  <link rel="stylesheet" href="../css/projects.css">

  <style>
    .detail-section {
      padding: 55px 0 80px;
      background: #f5f8f3;
      min-height: 60vh;
    }

    .detail-back {
      display: inline-block;
      margin-bottom: 25px;
      color: #21633e;
      font-weight: 700;
      text-decoration: none;
    }

    .detail-header {
      max-width: 850px;
      margin-bottom: 30px;
    }

    .detail-header h1 {
      margin: 10px 0 15px;
      color: #103625;
      font-size: clamp(30px, 5vw, 48px);
      line-height: 1.2;
    }

    .detail-header p {
      color: #647268;
      line-height: 1.9;
    }

    .detail-cover {
      width: 100%;
      max-height: 470px;
      object-fit: cover;
      border-radius: 18px;
      background: #e6f3e9;
    }

    .detail-content {
      max-width: 850px;
      margin-top: 35px;
      padding: 28px;
      border: 1px solid #e1e9df;
      border-radius: 16px;
      background: #fff;
    }

    .detail-content h2 {
      margin: 25px 0 10px;
      color: #174b35;
      font-size: 22px;
    }

    .detail-content h2:first-child {
      margin-top: 0;
    }

    .detail-content p,
    .detail-content li {
      color: #526157;
      line-height: 1.9;
    }

    .detail-gallery-title {
      margin: 45px 0 20px;
      color: #103625;
      font-size: 28px;
    }

    .detail-gallery {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 15px;
    }

    .detail-gallery img {
      width: 100%;
      height: 210px;
      object-fit: cover;
      border-radius: 12px;
      background: #e6f3e9;
    }

    .detail-error {
      padding: 25px;
      border-radius: 12px;
      background: #fff;
      color: #174b35;
    }

    @media (max-width: 650px) {
      .detail-content {
        padding: 20px;
      }

      .detail-gallery {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .detail-gallery img {
        height: 150px;
      }
    }
  </style>

  <script src="../js/menu.js" defer></script>
</head>

<body>

<header class="site-header">
  <div class="container nav">
    <a class="brand" href="../index.html">
      <span class="brand-icon">🌿</span>
      <span>
        <strong>UVS 2 ECO CLUB</strong>
        <small>GREEN FUTURE</small>
      </span>
    </a>

    <button class="menu-toggle" id="menuToggle"
      aria-label="Цэс нээх" aria-expanded="false">☰</button>

    <nav id="mainMenu" class="main-menu">
      <a href="../index.html">Нүүр</a>
      <a href="about.html">Бидний тухай</a>
      <a href="news.html">Мэдээ</a>
      <a class="active" href="projects.html">Төслүүд</a>
      <a href="gallery.html">Галерей</a>
      <a href="contact.html">Холбоо барих</a>
    </nav>
  </div>
</header>

<main class="detail-section">
  <div class="container">

    <a class="detail-back" href="projects.html">← Бүх төслүүд рүү буцах</a>

    <div id="projectDetail">
      <p>Төслийн мэдээллийг ачаалж байна...</p>
    </div>

  </div>
</main>

<footer class="site-footer">
  <div class="container">
    <div class="footer-brand">🌿 UVS 2 ECO CLUB</div>
    <div class="footer-bottom">
      <span>© 2026 UVS 2 ECO CLUB</span>
      <a href="../index.html">Нүүр хуудас руу буцах ↑</a>
    </div>
  </div>
</footer>

<script>
const projects = {
  cleanup: {
    category: "ЦЭВЭР ОРЧИН",
    title: "Орчны цэвэрлэгээ",
    intro: "Сургуулийн болон нийтийн эзэмшлийн орчныг цэвэр, ая тухтай байлгах санаачилга.",
    cover: "../images/project-cleanup.jpg",
    goal: "Хог хаягдлыг багасгах, сурагчдын байгальд ээлтэй хандлагыг нэмэгдүүлэх.",
    activities: [
      "Цэвэрлэгээ хийх талбайг сонгох",
      "Сурагчидтай хамтран цэвэрлэгээ зохион байгуулах",
      "Цуглуулсан хог хаягдлыг боломжтой тохиолдолд ангилан ялгах"
    ],
    result: "Хийсэн бодит ажлын үр дүн, оролцогчдын тоо болон цэвэрлэсэн талбайн мэдээллийг энд оруулна.",
    photos: [
      "../images/project-cleanup.jpg",
      "../images/project-cleanup-2.jpg",
      "../images/project-cleanup-3.jpg"
    ]
  },

  trees: {
    category: "НОГООН БАЙГУУЛАМЖ",
    title: "Ногоон орчин бүтээе",
    intro: "Мод, ургамал тарих, арчлах замаар сургуулийн орчныг ногоон болгох төсөл.",
    cover: "../images/project-trees.jpg",
    goal: "Ургамал, модыг хайрлан хамгаалах дадлыг сурагчдад төлөвшүүлэх.",
    activities: [
      "Тарих болон арчлах боломжтой талбайг сонгох",
      "Мод, ургамал тарих ажил зохион байгуулах",
      "Тарьсан ургамлаа тогтмол усалж, арчлах"
    ],
    result: "Тарьсан модны тоо, оролцсон сурагчид болон ургамлын арчилгааны явцыг энд бичнэ.",
    photos: [
      "../images/project-trees.jpg",
      "../images/project-trees-2.jpg",
      "../images/project-trees-3.jpg"
    ]
  },

  recycle: {
    category: "ДАХИН БОЛОВСРУУЛАЛТ",
    title: "Хогоо ангилж, хэвшил болгоё",
    intro: "Хог хаягдлыг ангилан ялгах мэдлэг, дадлыг сургуулийн орчинд түгээх төсөл.",
    cover: "../images/project-recycle.jpg",
    goal: "Дахин боловсруулах боломжтой хог хаягдлыг ялгаж, энгийн эко дадлыг хэвшүүлэх.",
    activities: [
      "Хог хаягдлыг ангилан ялгах талаар мэдээлэл түгээх",
      "Ангилан ялгах сав, тэмдэглэгээ байрлуулах боломжийг судлах",
      "Сурагчдад зөв дадлын талаар танилцуулах"
    ],
    result: "Ангилсан хог хаягдлын хэмжээ болон хэрэгжүүлсэн ажлын үр дүнг энд оруулна.",
    photos: [
      "../images/project-recycle.jpg",
      "../images/project-recycle-2.jpg",
      "../images/project-recycle-3.jpg"
    ]
  },

  awareness: {
    category: "СУРГАЛТ, СУРТАЛЧИЛГАА",
    title: "Байгаль хамгааллын боловсрол",
    intro: "Байгаль хамгааллын талаарх зөв мэдлэг, мэдээллийг бусдад түгээх санаачилга.",
    cover: "../images/project-awareness.jpg",
    goal: "Сурагчид байгаль хамгаалах үйл ажиллагаанд идэвхтэй оролцох нөхцөл бүрдүүлэх.",
    activities: [
      "Байгаль хамгааллын мэдээлэл, постер бэлтгэх",
      "Сурагчдад зориулсан танин мэдэхүйн үйл ажиллагаа зохион байгуулах",
      "Эко дадлын талаар мэдээлэл түгээх"
    ],
    result: "Зохион байгуулсан сургалт, үйл ажиллагаа болон оролцогчдын талаарх бодит мэдээллийг энд бичнэ.",
    photos: [
      "../images/project-awareness.jpg",
      "../images/project-awareness-2.jpg",
      "../images/project-awareness-3.jpg"
    ]
  }
};

const params = new URLSearchParams(window.location.search);
const id = params.get("id");
const project = projects[id];
const container = document.getElementById("projectDetail");

if (!project) {
  container.innerHTML = `
    <div class="detail-error">
      <h1>Төсөл олдсонгүй</h1>
      <p>Төслийн холбоос буруу эсвэл энэ төсөл бүртгэгдээгүй байна.</p>
      <a class="detail-back" href="projects.html">Төслүүд рүү буцах</a>
    </div>
  `;
} else {
  const activities = project.activities
    .map(item => `<li>${item}</li>`)
    .join("");

  const photos = project.photos
    .map((photo, index) => `
      <img
        src="${photo}"
        alt="${project.title} төслийн зураг ${index + 1}"
        loading="lazy">
    `)
    .join("");

  container.innerHTML = `
    <header class="detail-header">
      <span class="projects-label">${project.category}</span>
      <h1>${project.title}</h1>
      <p>${project.intro}</p>
    </header>

    <img class="detail-cover" src="${project.cover}" alt="${project.title}">

    <article class="detail-content">
      <h2>Төслийн зорилго</h2>
      <p>${project.goal}</p>

      <h2>Хийгдсэн болон төлөвлөсөн ажил</h2>
      <ul>${activities}</ul>

      <h2>Үр дүн</h2>
      <p>${project.result}</p>
    </article>

    <h2 class="detail-gallery-title">Төслийн гэрэл зургууд</h2>
    <div class="detail-gallery">${photos}</div>
  `;
}
</script>

</body>
</html>
