<script>
const articles = {
  irves: {
    title: "Ховордсон ан амьтдыг хамгаалъя",
    category: "БАЙГАЛЬ ХАМГААЛАЛ",
    date: "2026-10-13",
    image: "https://cdn.yld.mn/553c9866-92a8-446a-b029-31623f3b4793-1200x0-54233e8d-6e17-40cb-a736-e79431a28671-008.png",
    alt: "Цоохор ирвэс болон зэрлэг амьтад",
    paragraphs: [
      "Байгаль дэлхий олон төрлийн амьтан, ургамал, амьд биетийн өлгий билээ. Тэдгээрийн амьдрах орчныг хамгаалах нь экологийн тэнцвэрийг хадгалахад чухал ач холбогдолтой.",
      "Цоохор ирвэс нь Төв Азийн өндөр уулсын бүсэд амьдардаг ховор, нуугдмал амьдралтай махчин амьтан юм. Амьдрах орчны доройтол, хууль бус агнуур, идэш тэжээлийн хомсдол зэрэг нь тэдэнд тулгардаг аюулын тоонд ордог.",
      "Бид байгальд хариуцлагатай хандах, зэрлэг амьтдын амьдрах орчныг сүйтгэхгүй байх, байгаль хамгаалах ажлыг дэмжих замаар өөрсдийн хувь нэмрээ оруулж чадна.",
      "Ховор амьтдыг хамгаалах нь зөвхөн өнөөдрийн асуудал биш. Ирээдүй хойч үедээ баялаг байгаль дэлхийг өвлүүлэн үлдээх бидний нийтлэг үүрэг юм."
    ]
  },

  recycle: {
    title: "Хог хаягдлаа ангилцгаая",
    category: "ЭКО ДАДАЛ",
    date: "2026-10-13",
    image: "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRSSLmAP2B3yUyjkAxF0WnSpqIz7_M_RCHwV3M5_dkveA&s=10",
    alt: "Хог хаягдлыг ангилан ялгах",
    paragraphs: [
      "Хог хаягдлыг зөв ангилан ялгах нь хүрээлэн буй орчны бохирдлыг бууруулахад тусалдаг энгийн боловч чухал дадал юм.",
      "Цаас, хуванцар, шил, металл зэрэг материалыг бусад хогноос тусад нь ялгаж, боломжтой тохиолдолд дахин боловсруулах цэгт хүргэж болно. Гэхдээ материалын төрөл бүрийн хүлээн авах нөхцөл өөр байдаг тул орон нутгийн зааврыг дагах хэрэгтэй.",
      "Сургууль болон гэртээ хогийн савыг төрөлжүүлэн байрлуулах, нэг удаагийн бүтээгдэхүүний хэрэглээг багасгах, дахин ашиглах боломжтой зүйлсийг сонгох нь сайн эхлэл болно.",
      "Өдөр бүр хийдэг жижиг үйлдлүүд нийлээд том өөрчлөлтийг бий болгодог. Хогоо ангилж хэвшье, эх дэлхийгээ хайрлая."
    ]
  },

  nature: {
    title: "Байгаль бол бидний гэр",
    category: "НОГООН ИРЭЭДҮЙ",
    date: "2026-10-13",
    image: "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRKOOv-lumndaX4ZN5Ar7gvOqzrK54aVexicj4-6kCrlQ&s=10",
    alt: "Ногоон байгаль",
    paragraphs: [
      "Байгаль бол хүн төрөлхтөн болон олон мянган амьд биетийн хамт оршин байдаг бидний нийтлэг гэр юм. Цэвэр агаар, ус, хөрс, ургамал амьтан нь амьдралын үндэс болдог.",
      "Байгалиа хамгаалахын тулд заавал том ажил эхлүүлэх шаардлагагүй. Хог хаяхгүй байх, ус цахилгаанаа хэмнэх, мод ургамлаа хайрлах, нийтийн эзэмшлийн орчноо цэвэр байлгах зэрэг жижиг алхмаас эхэлж болно.",
      "Сурагч бүр өөрийн сургууль, гэр, орчиндоо эерэг өөрчлөлт бий болгож чадна. Найз нөхөдтэйгөө хамтран ажиллавал сайн дадал улам олон хүнд хүрнэ.",
      "Ногоон ирээдүйг хэн нэгэн ганцаараа бүтээхгүй. Бид бүгдийн хариуцлага, оролцоо, өдөр тутмын сонголтоор бий болно."
    ]
  }
};

const params = new URLSearchParams(window.location.search);
const id = params.get("id");
const article = articles[id];
const container = document.getElementById("articleContent");

if (!article) {
  document.title = "Мэдээ олдсонгүй | UVS 2 ECO CLUB";
  container.innerHTML = `
    <div class="article-error">
      <h1>Мэдээ олдсонгүй 🌿</h1>
      <p>Энэ мэдээ байхгүй эсвэл холбоос буруу байна.</p>
      <a href="news.html">Бүх мэдээ рүү буцах</a>
    </div>
  `;
} else {
  document.title = article.title + " | UVS 2 ECO CLUB";

  const cover = document.createElement("img");
  cover.className = "article-cover";
  cover.src = article.image;
  cover.alt = article.alt;
  cover.onerror = function () {
    this.style.display = "none";
  };

  const category = document.createElement("span");
  category.className = "article-category";
  category.textContent = article.category;

  const title = document.createElement("h1");
  title.className = "article-title";
  title.textContent = article.title;

  const date = document.createElement("p");
  date.className = "article-date";
  date.textContent = "Нийтэлсэн: " + article.date;

  const body = document.createElement("div");
  body.className = "article-body";

  article.paragraphs.forEach(function (paragraph) {
    const p = document.createElement("p");
    p.textContent = paragraph;
    body.appendChild(p);
  });

  const bottom = document.createElement("div");
  bottom.className = "article-bottom";
  bottom.innerHTML =
    "<strong>🌿 GREEN FUTURE</strong>" +
    "<p>Байгалиа хайрлая, ирээдүйгээ хамгаалъя.</p>" +
    '<a href="news.html">← Бусад мэдээг үзэх</a>';

  container.replaceChildren(
    cover, category, title, date, body, bottom
  );
}
</script>
